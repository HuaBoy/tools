server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass https://mp.holyview.cn:9443/api/;
        proxy_set_header Host mp.holyview.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization 'Basic c2FiZXI6c2FiZXJfc2VjcmV0';
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_ssl_server_name on;
    }

    location /smart-api/ {
        proxy_pass http://218.90.146.230:20001/;
        proxy_set_header Host 218.90.146.230;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization 'Basic c2FiZXJfaWRlbnRpdHlfY2xpZW50OnNhYmVyX2lkZW50aXR5X3NlY3JldA==';
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /iot-api/ {
        proxy_pass http://218.90.146.230:20001/;
        proxy_set_header Host 218.90.146.230;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization 'Basic c2FiZXI6c2FiZXJfc2VjcmV0';
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}