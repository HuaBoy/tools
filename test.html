<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>测试小工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
body{background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%);min-height:100vh}
.drop-box{border:2px dashed #4f46e5;transition:all .3s}
.drop-box.active{background:#eef2ff;border-color:#4338ca}
.login-box{animation:fade .4s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="p-4 md:p-8">

<div id="loginPage" class="login-box max-w-md mx-auto mt-20 bg-white rounded-2xl shadow-xl p-8">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-indigo-600">测试小工具</h1>
    <p class="text-gray-400 text-sm mt-1">一次性密码 · 绑定设备 · 5小时闲置自动退出</p>
  </div>
  <div class="space-y-4">
    <input id="pwdInput" class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="请输入一次性密码" type="password">
    <button id="loginBtn" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700 transition">登录</button>
    <p id="tip" class="text-red-500 text-sm text-center hidden">密码错误或已失效</p>
  </div>
</div>

<div id="mainPage" class="hidden max-w-4xl mx-auto">
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-indigo-600">测试小工具</h1>
    <p class="text-gray-500 text-sm">日志批量解密工具</p>
  </div>
  <div id="dropBox" class="drop-box rounded-2xl p-10 text-center cursor-pointer bg-white shadow-lg mb-6">
    <div class="text-5xl text-indigo-500 mb-2">📁</div>
    <p class="text-gray-700 font-medium">拖拽日志文件到此处 或 点击上传</p>
    <p class="text-xs text-gray-400 mt-1">支持 .log / .txt 批量</p>
    <input id="fileInput" type="file" multiple accept=".log,.txt" class="hidden">
  </div>
  <div class="flex gap-3 mb-6">
    <button id="startBtn" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-medium hover:bg-indigo-700 shadow">开始解密并导出</button>
    <button id="clearBtn" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-xl font-medium">清空列表</button>
  </div>
  <div id="progressWrap" class="hidden bg-white rounded-xl p-4 shadow mb-6">
    <div class="flex justify-between text-sm mb-2">
      <span>处理进度</span><span id="progressText" class="text-indigo-600">0/0</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-2">
      <div id="progressBar" class="bg-indigo-600 h-2 rounded-full" style="width:0%"></div>
    </div>
  </div>
  <div class="bg-white rounded-xl shadow-lg overflow-hidden max-h-[420px] overflow-y-auto">
    <div id="emptyTip" class="py-16 text-center text-gray-400">暂无文件</div>
    <div id="fileList" class="divide-y divide-gray-100"></div>
  </div>
</div>

<script>
!function(){
const _autoExitTime=18000000;
let _idleTimer=null;
function _resetIdle(){clearTimeout(_idleTimer);_idleTimer=setTimeout(()=>{loginPage.classList.remove("hidden");mainPage.classList.add("hidden")},_autoExitTime)}
const _pwList=["2J2n49D9Ld","3K3p57E7Me","4M4r78G8Ng","5P5t82I2Qf","6R6v94K4Sh","7T7x16L6Ui","8V9z27N7Wk","9X1B39P9Ym","aZ2C4gQ1An","bY3E5iR2Bo","cX4F7kS3Cp","dW5G9mT4Dq","eV6H1oU5Er","fU7J3qV6Fs","gT8K4rW7Gt","hS9M6tX8Hp","iR1N7vY9Iq","jQ2P8xZ1Jr","kP3Q1BZ2Ks","jO4R3CY3Lr","nM5T4DX4Mt","mL6V6FW5Np","kL7W7GV6Or","jK8X8EU7Qp","iJ9Y9CT8Rs","hz1B2BS9Sn","gy2C3AR1Tp","fx3D4AQ2Uo","ew4F5ZP3Vm","dv5G6YO4Wl","cu6H7XN5Bk","bt7J8WM6Cj","as8K9VL7Di","zr9L1UK9Eh","yq1N2TJ7Fa","xp2P3SI8Gb","wo3Q4RH9Ic","vn4R5QG1Jd","um5T6PF2Ke","tl6V7OE3Lb","sk7W8ND4Mc","rj8X9MC5Na","qi9Z1LB7Ob","ph1A2KA8Pc","og2B3Jz9Qd","nf3C4Iy1Re","me4D5Hx2Sf","ld5F6Gw3Tg","kc6G7Fv4Uh","jb7H8Eu5Vi","ia8J9Dt6Wj","hz9K1Cs7Xh","gy1M2Br9Yp","fx2N3Aq1Zo","ew3P4Zp2An","dv4Q5Yo3Bm","cu5R6Xn4Cl","bt6T7Wm5Dk","as7V8Vl6Ej","zr8W9Uk7Fh","yq9X1Tj8Gg","xp1Z2Si9Ia","wo2A3Rh8Jb","vn3B4Qg9Kc","um4C5Pf6Ld","tl5D6Oe7Me","sk6F7Nd8Nf","rj7G8Mc9Og","qi8H9Lb1Pa","ph9J1Ka2Qb","og1K2Jz3Rc","nf2L3Iy4Sd","me3M4Hx5Te","ld4N5Gw6Uf","kc5P6Fv7Vg","jb6Q7Eu8Wh","ia7R8Dt9Yi","hz8S9Cs1Zj","gy9T2Br2Ak","fx1U3Aq3Bl","ew2V4Zp4Cm","dv3W5Yo5Dn","cu4X6Xn6Ek","bt5Y7Wm7Fl","as6Z8Vl8Gj","zr7A9Uk9Hh","yq8B1Tj1Ii","xp9C2Si2Jg","wo1D3Rh4Kf","vn2F4Qg5Le","um3G5Pf7Md","tl4H6Oe8Nc","sk5J7Nd9Ob","rj6K8Mc1Pa","qi7M9Lb2Qz","ph8N1Ka3Ry","og9P2Jz4Sx","nf1Q3Iy5Tw","me2R4Hx6Uv","ld3S5Gw7Vb"];
const _secKey="123456abc2345678";
const _secReg=/##@@##([\s\S]*?)@@##@@/g;
function _getDevId(){let a=navigator.userAgent+screen.width+screen.height+navigator.hardwareConcurrency;return CryptoJS.MD5(a).toString()}
function _getUsedPw(){let a=[];let b=localStorage.getItem("DEV_SIG");if(!b||b!==_getDevId())return[];let c=localStorage.getItem("USED_KEYS");return c?JSON.parse(c):a}
function _usePw(a){let b=_getUsedPw();if(b.includes(a))return false;b.push(a);localStorage.setItem("DEV_SIG",_getDevId());localStorage.setItem("USED_KEYS",JSON.stringify(b));return true}
function _decryptLog(a){return a.replace(_secReg,(b,c)=>{let d=c.replace(/\s/g,"");try{let e=CryptoJS.enc.Utf8.parse(_secKey);let f=CryptoJS.AES.decrypt(d,e,{mode:CryptoJS.mode.ECB,padding:CryptoJS.pad.Pkcs7});return f.toString(CryptoJS.enc.Utf8)||b}catch(g){return b}})}
function _readFile(a){return new Promise(b=>{let c=new FileReader();c.onload=()=>b(c.result);c.readAsText(a,"UTF-8")})}
const loginPage=document.getElementById("loginPage");
const mainPage=document.getElementById("mainPage");
const pwdInput=document.getElementById("pwdInput");
const loginBtn=document.getElementById("loginBtn");
const tip=document.getElementById("tip");
const dropBox=document.getElementById("dropBox");
const fileInput=document.getElementById("fileInput");
const fileList=document.getElementById("fileList");
const emptyTip=document.getElementById("emptyTip");
const startBtn=document.getElementById("startBtn");
const clearBtn=document.getElementById("clearBtn");
const progressWrap=document.getElementById("progressWrap");
const progressBar=document.getElementById("progressBar");
const progressText=document.getElementById("progressText");
let files=[];
["mousemove","keydown","click","scroll"].forEach(e=>document.addEventListener(e,_resetIdle));
loginBtn.onclick=()=>{let v=pwdInput.value.trim();if(!_pwList.includes(v)){tip.classList.remove("hidden");return}if(!_usePw(v)){tip.classList.remove("hidden");tip.innerText="密码已失效";return}loginPage.classList.add("hidden");mainPage.classList.remove("hidden");_resetIdle()};
["dragenter","dragover","dragleave","drop"].forEach(e=>dropBox.addEventListener(e,t=>t.preventDefault()));
dropBox.addEventListener("dragenter",()=>dropBox.classList.add("active"));
dropBox.addEventListener("dragleave",()=>dropBox.classList.remove("active"));
dropBox.addEventListener("drop",e=>{dropBox.classList.remove("active");files=Array.from(e.dataTransfer.files);renderList();_resetIdle()});
dropBox.onclick=()=>fileInput.click();
fileInput.onchange=e=>{files=Array.from(e.target.files);renderList();_resetIdle()};
function renderList(){if(files.length===0){emptyTip.classList.remove("hidden");fileList.innerHTML="";return}emptyTip.classList.add("hidden");fileList.innerHTML="";files.forEach((f,i)=>{let item=document.createElement("div");item.className="px-4 py-3 text-sm grid grid-cols-12";item.innerHTML=`<div class="col-span-6 truncate">${f.name}</div><div class="col-span-3 text-center"><span id="s-${i}" class="px-2 py-1 rounded-full bg-gray-100 text-xs">待解密</span></div><div class="col-span-3 text-center"><span id="e-${i}" class="px-2 py-1 rounded-full bg-gray-100 text-xs">待导出</span></div>`;fileList.appendChild(item)})}
startBtn.onclick=async ()=>{if(files.length===0)return alert("请上传文件");startBtn.disabled=true;progressWrap.classList.remove("hidden");const zip=new JSZip();for(let i=0;i<files.length;i++){let s=document.getElementById(`s-${i}`);s.className="px-2 py-1 rounded-full bg-blue-100 text-blue-600 text-xs";s.innerText="解密中";try{let text=await _readFile(files[i]);let res=_decryptLog(text);zip.file("解密_"+files[i].name,res);s.className="px-2 py-1 rounded-full bg-green-100 text-green-600 text-xs";s.innerText="完成"}catch(e){s.className="px-2 py-1 rounded-full bg-red-100 text-red-600 text-xs";s.innerText="失败"}let p=Math.round(((i+1)/files.length)*100);progressBar.style.width=p+"%";progressText.innerText=`${i+1}/${files.length}`}files.forEach((_,i)=>{let e=document.getElementById(`e-${i}`);e.className="px-2 py-1 rounded-full bg-green-100 text-green-600 text-xs";e.innerText="已导出"});zip.generateAsync({type:"blob"}).then(b=>{saveAs(b,"测试工具_解密结果.zip");startBtn.disabled=false;_resetIdle()});_resetIdle()};
clearBtn.onclick=()=>{files=[];renderList();progressWrap.classList.add("hidden");progressBar.style.width="0%";progressText.innerText="0/0";_resetIdle()};
}();
</script>
</body>
</html>
