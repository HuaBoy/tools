version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tester-platform-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    networks:
      - tester-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 可选：Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: tester-platform-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx.conf.example:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - tester-net

networks:
  tester-net:
    driver: bridge
