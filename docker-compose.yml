version: '3.8'

services:
  # ===== PostgreSQL + pgvector =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-kb-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-kbuser}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-kbpass_2026}
      POSTGRES_DB: ${PG_DB:-knowledge}
      TZ: Asia/Shanghai
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - tester-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-kbuser} -d ${PG_DB:-knowledge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== Go 后端 =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tester-platform-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
      # OLLAMA_URL 已移除（Ollama不再部署在服务器）
      # 注意：DB_DSN 指向 docker 内的 postgres 服务
      - DB_DSN=postgres://${PG_USER:-kbuser}:${PG_PASSWORD:-kbpass_2026}@postgres:5432/${PG_DB:-knowledge}?sslmode=disable
      - DATABASE_URL=postgres://${PG_USER:-kbuser}:${PG_PASSWORD:-kbpass_2026}@postgres:5432/${PG_DB:-knowledge}?sslmode=disable
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/logs:/app/logs
      - ./data/knowledge:/app/data/knowledge
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tester-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===== 前端 =====
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tester-platform-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - tester-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tester-net:
    driver: bridge
